<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <meta name="description" content="一个干净、有温度的 Hello World 开场页。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14212b;
      --ink-soft: #3a4a57;
      --fog: #e8f1f4;
      --mist: #c5dde6;
      --sea: #2f6f7e;
      --sea-deep: #1d4f5c;
      --sand: #f3ebe0;
      --sun: #e8b86d;
      --white: #f7fbfc;
      --font-display: "Bricolage Grotesque", Georgia, serif;
      --font-body: "Literata", Georgia, serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--fog);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      isolation: isolate;
    }

    .hero__sky {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 70% 55% at 72% 18%, rgba(232, 184, 109, 0.55), transparent 58%),
        radial-gradient(ellipse 55% 45% at 18% 28%, rgba(197, 221, 230, 0.9), transparent 60%),
        linear-gradient(180deg, #9fc4d0 0%, #d7e8ee 42%, #eef4f2 68%, #d9ebe6 100%);
      animation: sky-breathe 10s ease-in-out infinite alternate;
    }

    .hero__horizon {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(48vh, 420px);
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .hero__horizon svg {
      width: 140%;
      min-width: 900px;
      height: 100%;
      display: block;
      margin-left: -20%;
      animation: tide 14s var(--ease) infinite alternate;
    }

    .stage {
      width: min(920px, 100%);
      text-align: center;
      transform: translateY(18px);
      opacity: 0;
      animation: rise-in 1.1s var(--ease) 0.15s forwards;
    }

    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.4rem, 12vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
      color: var(--ink);
    }

    .brand span {
      display: inline-block;
      background: linear-gradient(105deg, var(--ink) 20%, var(--sea-deep) 55%, var(--sea) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      margin: 1.15rem auto 0;
      max-width: 28rem;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      line-height: 1.55;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.85rem 1.45rem;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.35s var(--ease), background 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn--primary {
      background: var(--ink);
      color: var(--white);
      border: 1px solid var(--ink);
    }

    .btn--primary:hover {
      background: var(--sea-deep);
      border-color: var(--sea-deep);
    }

    .btn--ghost {
      background: rgba(247, 251, 252, 0.55);
      border: 1px solid rgba(20, 33, 43, 0.18);
      color: var(--ink);
      backdrop-filter: blur(8px);
    }

    .btn--ghost:hover {
      background: rgba(247, 251, 252, 0.9);
      border-color: rgba(20, 33, 43, 0.35);
    }

    .about {
      padding: clamp(4rem, 10vw, 7rem) clamp(1.5rem, 4vw, 3rem);
      background:
        linear-gradient(180deg, #d9ebe6 0%, var(--sand) 100%);
    }

    .about__inner {
      width: min(680px, 100%);
      margin: 0 auto;
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    }

    .about__inner.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .about h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .about p {
      margin: 1rem auto 0;
      max-width: 34rem;
      color: var(--ink-soft);
      font-size: 1.08rem;
      line-height: 1.65;
    }

    @keyframes rise-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sky-breathe {
      from {
        filter: saturate(1) brightness(1);
      }
      to {
        filter: saturate(1.08) brightness(1.04);
      }
    }

    @keyframes tide {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-6%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__sky,
      .hero__horizon svg,
      .stage,
      .about__inner {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="开场">
      <div class="hero__sky" aria-hidden="true"></div>
      <div class="hero__horizon" aria-hidden="true">
        <svg viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" role="img">
          <defs>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6fa9b4"/>
              <stop offset="45%" stop-color="#3f7f8d"/>
              <stop offset="100%" stop-color="#1d4f5c"/>
            </linearGradient>
            <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#f7fbfc" stop-opacity="0.15"/>
              <stop offset="50%" stop-color="#f7fbfc" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#f7fbfc" stop-opacity="0.15"/>
            </linearGradient>
          </defs>
          <path fill="url(#water)" d="M0 120 C180 70 320 180 480 140 C640 100 760 40 920 80 C1080 120 1240 170 1440 110 L1440 420 L0 420 Z"/>
          <path fill="url(#foam)" d="M0 168 C220 118 360 210 540 170 C720 130 860 90 1040 140 C1180 178 1320 150 1440 128 L1440 210 C1280 240 1140 250 980 210 C780 160 620 210 440 250 C260 288 120 240 0 220 Z"/>
          <circle cx="1080" cy="70" r="54" fill="#e8b86d" opacity="0.9"/>
          <circle cx="1080" cy="70" r="78" fill="#e8b86d" opacity="0.18"/>
        </svg>
      </div>

      <div class="stage">
        <h1 class="brand"><span>Hello World</span></h1>
        <p class="lede">从一句问候开始，打开第一屏属于你的网页。</p>
        <div class="actions">
          <a class="btn btn--primary" href="#about">继续往下看</a>
          <a class="btn btn--ghost" href="https://github.com/oumingyuan/helloworld" rel="noopener noreferrer" target="_blank">查看仓库</a>
        </div>
      </div>
    </section>

    <section class="about" id="about">
      <div class="about__inner" data-reveal>
        <h2>极简，但不空洞</h2>
        <p>这是一个静态开场页：清晰的品牌呈现、一段说明，以及可继续探索的入口。没有多余模块，只保留第一印象该有的温度与层次。</p>
      </div>
    </section>
  </main>

  <script>
    const reveal = document.querySelector("[data-reveal]");
    if (reveal && "IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.35 });
      io.observe(reveal);
    } else if (reveal) {
      reveal.classList.add("is-visible");
    }
  </script>
</body>
</html>
