<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <meta name="description" content="一个干净、有温度的 Hello World 开场页。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #4a1f33;
      --ink-soft: #7a4558;
      --fog: #fff0f4;
      --mist: #f5c2d0;
      --sea: #e06b8a;
      --sea-deep: #c44569;
      --sand: #ffe8ef;
      --sun: #ffb4c8;
      --white: #fff7fa;
      --font-display: "Bricolage Grotesque", Georgia, serif;
      --font-body: "Literata", Georgia, serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--fog);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      isolation: isolate;
    }

    .hero__sky {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 70% 55% at 72% 18%, rgba(255, 180, 200, 0.7), transparent 58%),
        radial-gradient(ellipse 55% 45% at 18% 28%, rgba(255, 214, 226, 0.95), transparent 60%),
        linear-gradient(180deg, #f7b6c8 0%, #ffd6e2 42%, #fff0f4 68%, #f8c9d6 100%);
      animation: sky-breathe 10s ease-in-out infinite alternate;
    }

    .hero__horizon {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(48vh, 420px);
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .hero__horizon svg {
      width: 140%;
      min-width: 900px;
      height: 100%;
      display: block;
      margin-left: -20%;
      animation: tide 14s var(--ease) infinite alternate;
    }

    .stage {
      width: min(920px, 100%);
      text-align: center;
      animation: rise-in 1.1s var(--ease) both;
    }

    .brand {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.4rem, 12vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
      color: var(--ink);
    }

    .brand span {
      display: inline-block;
      background: linear-gradient(105deg, var(--ink) 20%, var(--sea-deep) 55%, var(--sea) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      margin: 1.15rem auto 0;
      max-width: 28rem;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      line-height: 1.55;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.85rem 1.45rem;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.35s var(--ease), background 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn--primary {
      background: var(--ink);
      color: var(--white);
      border: 1px solid var(--ink);
    }

    .btn--primary:hover {
      background: var(--sea-deep);
      border-color: var(--sea-deep);
    }

    .btn--ghost {
      background: rgba(255, 247, 250, 0.55);
      border: 1px solid rgba(74, 31, 51, 0.18);
      color: var(--ink);
      backdrop-filter: blur(8px);
    }

    .btn--ghost:hover {
      background: rgba(255, 247, 250, 0.9);
      border-color: rgba(74, 31, 51, 0.35);
    }

    .about {
      padding: clamp(4rem, 10vw, 7rem) clamp(1.5rem, 4vw, 3rem);
      background:
        linear-gradient(180deg, #f8c9d6 0%, var(--sand) 100%);
    }

    .about__inner {
      width: min(680px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      .about__inner {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
      }

      .about__inner.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .about h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .about p {
      margin: 1rem auto 0;
      max-width: 34rem;
      color: var(--ink-soft);
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .board {
      padding: clamp(3.5rem, 9vw, 6rem) clamp(1.5rem, 4vw, 3rem) 5rem;
      background: linear-gradient(180deg, var(--sand) 0%, #fff7fa 100%);
    }

    .board__inner {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    .board__head {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .board__head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.03em;
    }

    .board__head p {
      margin: 0.75rem auto 0;
      max-width: 32rem;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .board__form {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
      padding: 1.15rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(74, 31, 51, 0.1);
      border-radius: 14px;
    }

    .board__form label {
      display: grid;
      gap: 0.35rem;
      text-align: left;
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--ink);
    }

    .board__form input,
    .board__form textarea {
      width: 100%;
      border: 1px solid rgba(74, 31, 51, 0.18);
      border-radius: 10px;
      padding: 0.8rem 0.9rem;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }

    .board__form input:focus,
    .board__form textarea:focus {
      outline: 2px solid rgba(224, 107, 138, 0.45);
      border-color: var(--sea);
    }

    .board__status {
      min-height: 1.4rem;
      margin: 0.15rem 0 0;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .board__status[data-tone="error"] {
      color: #a1284f;
    }

    .board__status[data-tone="ok"] {
      color: var(--sea-deep);
    }

    .board__list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.85rem;
    }

    .board__item {
      padding: 1rem 1.1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(74, 31, 51, 0.08);
    }

    .board__item strong {
      font-family: var(--font-display);
      font-size: 1rem;
    }

    .board__item time {
      display: block;
      margin-top: 0.2rem;
      color: var(--ink-soft);
      font-size: 0.85rem;
    }

    .board__item p {
      margin: 0.55rem 0 0;
      line-height: 1.55;
      color: var(--ink);
    }

    .board__empty {
      text-align: center;
      color: var(--ink-soft);
      padding: 1rem 0;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sky-breathe {
      from {
        filter: saturate(1) brightness(1);
      }
      to {
        filter: saturate(1.08) brightness(1.04);
      }
    }

    @keyframes tide {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-6%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__sky,
      .hero__horizon svg,
      .stage,
      .about__inner {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="开场">
      <div class="hero__sky" aria-hidden="true"></div>
      <div class="hero__horizon" aria-hidden="true">
        <svg viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" role="img">
          <defs>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f08aa8"/>
              <stop offset="45%" stop-color="#d95a7f"/>
              <stop offset="100%" stop-color="#b03d62"/>
            </linearGradient>
            <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff7fa" stop-opacity="0.15"/>
              <stop offset="50%" stop-color="#fff7fa" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#fff7fa" stop-opacity="0.15"/>
            </linearGradient>
          </defs>
          <path fill="url(#water)" d="M0 150 C240 90 360 210 540 160 C720 110 860 70 1040 120 C1200 160 1320 140 1440 100 L1440 420 L0 420 Z"/>
          <path fill="url(#foam)" d="M0 190 C200 140 340 230 520 190 C700 150 860 120 1040 165 C1200 205 1320 180 1440 155 L1440 250 C1280 280 1120 290 940 250 C740 200 580 250 400 285 C240 318 120 270 0 250 Z"/>
          <circle cx="1120" cy="88" r="48" fill="#ffb4c8" opacity="0.95"/>
          <circle cx="1120" cy="88" r="72" fill="#ffb4c8" opacity="0.22"/>
        </svg>
      </div>

      <div class="stage">
        <h1 class="brand"><span>Hello World</span></h1>
        <p class="lede">从一句问候开始，打开第一屏属于你的网页。</p>
        <div class="actions">
          <a class="btn btn--primary" href="#board">留下问候</a>
          <a class="btn btn--ghost" href="https://github.com/oumingyuan/helloworld" rel="noopener noreferrer" target="_blank">查看仓库</a>
        </div>
      </div>
    </section>

    <section class="about" id="about">
      <div class="about__inner" data-reveal>
        <h2>极简，但不空洞</h2>
        <p>页面负责展示与交互；Node API 负责读写；SQLite 负责持久化。这是最常见的「前端 → 后端 → 数据库」接法。</p>
      </div>
    </section>

    <section class="board" id="board" aria-label="问候留言板">
      <div class="board__inner">
        <div class="board__head">
          <h2>打个招呼</h2>
          <p>提交后会经 <code>/api/greetings</code> 写入 SQLite，刷新仍在。</p>
        </div>

        <form class="board__form" id="greeting-form">
          <label>
            昵称
            <input name="name" maxlength="40" required placeholder="你的名字" autocomplete="nickname">
          </label>
          <label>
            留言
            <textarea name="message" rows="3" maxlength="200" required placeholder="说一句 Hello"></textarea>
          </label>
          <button class="btn btn--primary" type="submit">写入数据库</button>
          <p class="board__status" id="board-status" role="status" aria-live="polite"></p>
        </form>

        <ul class="board__list" id="greeting-list"></ul>
      </div>
    </section>
  </main>

  <script>
    const reveal = document.querySelector("[data-reveal]");
    if (reveal && "IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.35 });
      io.observe(reveal);
    } else if (reveal) {
      reveal.classList.add("is-visible");
    }
    setTimeout(() => reveal && reveal.classList.add("is-visible"), 1200);

    const API_BASE = window.HELLO_API_BASE || "";
    const form = document.getElementById("greeting-form");
    const listEl = document.getElementById("greeting-list");
    const statusEl = document.getElementById("board-status");

    function setStatus(text, tone) {
      statusEl.textContent = text || "";
      statusEl.dataset.tone = tone || "";
    }

    function formatTime(value) {
      try {
        return new Date(value.replace(" ", "T") + "Z").toLocaleString("zh-CN");
      } catch {
        return value;
      }
    }

    function renderGreetings(items) {
      if (!items.length) {
        listEl.innerHTML = '<li class="board__empty">还没有留言，来写第一条吧。</li>';
        return;
      }

      listEl.innerHTML = items
        .map(
          (item) => `
            <li class="board__item">
              <strong>${escapeHtml(item.name)}</strong>
              <time datetime="${escapeHtml(item.created_at)}">${escapeHtml(formatTime(item.created_at))}</time>
              <p>${escapeHtml(item.message)}</p>
            </li>`
        )
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function loadGreetings() {
      try {
        const res = await fetch(`${API_BASE}/api/greetings`);
        if (!res.ok) throw new Error("load failed");
        const data = await res.json();
        renderGreetings(data.items || []);
        setStatus("");
      } catch {
        renderGreetings([]);
        setStatus("连不上 API。请先运行 npm start（不要只用 GitHub Pages 静态打开）。", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const payload = {
        name: String(formData.get("name") || "").trim(),
        message: String(formData.get("message") || "").trim(),
      };

      setStatus("正在写入…");
      try {
        const res = await fetch(`${API_BASE}/api/greetings`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "save failed");
        form.reset();
        setStatus("已写入 SQLite。", "ok");
        await loadGreetings();
      } catch (error) {
        setStatus(error.message || "保存失败", "error");
      }
    });

    loadGreetings();
  </script>
</body>
</html>
