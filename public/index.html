<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <meta name="description" content="一个干净、有温度的 Hello World 开场页。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-label="开场">
      <div class="hero__sky" aria-hidden="true"></div>
      <div class="hero__horizon" aria-hidden="true">
        <svg viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" role="img">
          <defs>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f08aa8"/>
              <stop offset="45%" stop-color="#d95a7f"/>
              <stop offset="100%" stop-color="#b03d62"/>
            </linearGradient>
            <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff7fa" stop-opacity="0.15"/>
              <stop offset="50%" stop-color="#fff7fa" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#fff7fa" stop-opacity="0.15"/>
            </linearGradient>
          </defs>
          <path fill="url(#water)" d="M0 150 C240 90 360 210 540 160 C720 110 860 70 1040 120 C1200 160 1320 140 1440 100 L1440 420 L0 420 Z"/>
          <path fill="url(#foam)" d="M0 190 C200 140 340 230 520 190 C700 150 860 120 1040 165 C1200 205 1320 180 1440 155 L1440 250 C1280 280 1120 290 940 250 C740 200 580 250 400 285 C240 318 120 270 0 250 Z"/>
          <circle cx="1120" cy="88" r="48" fill="#ffb4c8" opacity="0.95"/>
          <circle cx="1120" cy="88" r="72" fill="#ffb4c8" opacity="0.22"/>
        </svg>
      </div>

      <div class="stage">
        <h1 class="brand"><span>Hello World</span></h1>
        <p class="lede">从一句问候开始，打开第一屏属于你的网页。</p>
        <div class="actions">
          <a class="btn btn--primary" href="#board">留下问候</a>
          <a class="btn btn--ghost" href="https://github.com/oumingyuan/helloworld" rel="noopener noreferrer" target="_blank">查看仓库</a>
        </div>
      </div>
    </section>

    <section class="about" id="about">
      <div class="about__inner" data-reveal>
        <h2>极简，但不空洞</h2>
        <p>推荐用 Render 部署（国内通常可直连写库）。也支持 Cloudflare Workers + D1（国内访问 workers.dev 常被拦）。</p>
      </div>
    </section>

    <section class="board" id="board" aria-label="问候留言板">
      <div class="board__inner">
        <div class="board__head">
          <h2>打个招呼</h2>
          <p>提交后会经 <code>/api/greetings</code> 写入 SQLite。请用 Render 地址或本地 <code>npm start</code>，不要只用 GitHub Pages。</p>
        </div>

        <form class="board__form" id="greeting-form">
          <label>
            昵称
            <input name="name" maxlength="40" required placeholder="你的名字" autocomplete="nickname">
          </label>
          <label>
            留言
            <textarea name="message" rows="3" maxlength="200" required placeholder="说一句 Hello"></textarea>
          </label>
          <button class="btn btn--primary" type="submit">写入数据库</button>
          <p class="board__status" id="board-status" role="status" aria-live="polite"></p>
        </form>

        <ul class="board__list" id="greeting-list"></ul>
      </div>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
