name = "helloworld"
main = "src/worker.js"
compatibility_date = "2025-10-01"

# 首次部署：npx wrangler d1 create helloworld
# 把输出的 database_id 填到下面，再执行 npm run db:migrate
[[d1_databases]]
binding = "DB"
database_name = "helloworld"
database_id = "5d774874-aa53-45e0-b87e-45c36f110ae8"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
